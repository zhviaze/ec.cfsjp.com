<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理機能について | CFS EC Supply</title>
    <meta
      name="description"
      content="CFS EC Supplyの管理機能は、バックエンド環境構築後に提供予定です。"
    >
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <a class="brand login-brand" href="index.html#top" aria-label="CFS EC home">
        <span class="brand-mark">CFS</span>
        <span class="brand-text">EC Supply</span>
      </a>

      <section class="login-card" aria-labelledby="loginTitle">
        <p class="eyebrow">Admin access</p>
        <h1 id="loginTitle">商品編集について</h1>
        <p>
          現在の公開サイトはGitHub Pagesで動く静的サイトです。商品写真や説明文を変更する場合は、
          GitHub RepoのHTMLと画像ファイルを編集して公開します。
        </p>
        <p>
          ブラウザ上の管理者ログイン、画像アップロード、商品登録を安全に行うには、
          Tencent Cloudなどにバックエンド、DB、画像ストレージ、認証付き管理画面を追加します。
        </p>
        <a class="primary-button" href="index.html#sets">商品ページへ戻る</a>
      </section>
    </main>
  </body>
</html>
